# Builds the MPC (32-bit ARM) plugin on GitHub's servers, runs every test, and packages the installer zip.
# Push to main: the zip appears under Actions > the run > Artifacts.
# Push a tag like v1.0.0: the zip is also attached to a GitHub Release.
name: Build MPC plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian 11 toolchain: keeps glibc symbol versions old enough for MPC OS (scripts/check_so.sh enforces it)
    container: debian:bullseye
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # Debian 11 is retired; once its packages move to archive.debian.org, use the archive instead
          if ! apt-get update -qq; then
            echo "Debian 11 mirrors unavailable: switching to archive.debian.org"
            printf '%s\n' \
              "deb http://archive.debian.org/debian bullseye main" \
              "deb http://archive.debian.org/debian bullseye-updates main" \
              "deb http://archive.debian.org/debian-security bullseye-security main" > /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*
            apt-get -o Acquire::Check-Valid-Until=false update -qq
          fi
          apt-get install -y -qq --no-install-recommends ca-certificates gcc libc6-dev gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross binutils-arm-linux-gnueabihf make python3 zip
          # ARM emulator for the plugin test; the build still works without it
          apt-get install -y -qq --no-install-recommends qemu-user || echo "qemu-user unavailable: ARM emulation test will be skipped"

      - name: Native build and tests
        run: make test

      - name: ARM build and binary checks
        run: make arm

      - name: Plugin test under ARM emulation
        run: |
          if command -v qemu-arm >/dev/null; then make arm-test; else echo "skipped: no qemu-arm"; fi

      - name: Package installer zip
        run: make release

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-MPC
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
